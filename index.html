<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>槍戰求生</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0d1117;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; box-shadow: 0 8px 30px rgba(0,0,0,.6); border-radius: 6px; cursor: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
(() => {
  'use strict';

  const W = 960, H = 600;
  const FONT = '"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  function resize() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    const cw = Math.floor(W * s), ch = Math.floor(H * s);
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    canvas.width = Math.floor(cw * dpr);
    canvas.height = Math.floor(ch * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ===== 常數 =====
  const MAG = 15;
  const RELOAD_T = 1.1;
  const FIRE_CD = 0.13;
  const BULLET_SPEED = 720;
  const PLAYER_SPEED = 230;

  // ===== 最高分 =====
  let best = 0;
  try { best = parseInt(localStorage.getItem('shooterBest') || '0', 10) || 0; } catch (e) {}
  function saveBest() { try { localStorage.setItem('shooterBest', String(best)); } catch (e) {} }

  // ===== 音效 =====
  let ac = null;
  function ensureAudio() {
    if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A(); }
    if (ac && ac.state === 'suspended') ac.resume();
  }
  function tone(f, d, type = 'square', v = 0.05, to = null) {
    if (!ac) return;
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + d);
  }
  const sfx = {
    shoot:  () => tone(520, 0.07, 'square', 0.035, 140),
    eshoot: () => tone(300, 0.09, 'sawtooth', 0.025, 120),
    hit:    () => tone(220, 0.06, 'triangle', 0.04, 120),
    kill:   () => tone(160, 0.18, 'sawtooth', 0.06, 40),
    hurt:   () => tone(130, 0.2, 'sawtooth', 0.08, 50),
    reload: () => { tone(300, 0.05, 'square', 0.04); setTimeout(() => tone(450, 0.06, 'square', 0.04), 500); },
    pickup: () => { tone(660, 0.08, 'triangle', 0.07); setTimeout(() => tone(990, 0.1, 'triangle', 0.07), 70); },
    wave:   () => { tone(440, 0.12, 'triangle', 0.07); setTimeout(() => tone(660, 0.12, 'triangle', 0.07), 120); setTimeout(() => tone(880, 0.18, 'triangle', 0.07), 240); },
    over:   () => tone(400, 0.8, 'sawtooth', 0.08, 50)
  };

  // ===== 地圖障礙物 =====
  const walls = [
    { x: 170, y: 120, w: 70, h: 70 },
    { x: 720, y: 120, w: 70, h: 70 },
    { x: 170, y: 410, w: 70, h: 70 },
    { x: 720, y: 410, w: 70, h: 70 },
    { x: 420, y: 260, w: 120, h: 80 },
    { x: 440, y: 60,  w: 80,  h: 40 },
    { x: 440, y: 500, w: 80,  h: 40 }
  ];

  // ===== 狀態 =====
  let state = 'menu';       // menu | play | paused | over
  let player, bullets, ebullets, enemies, particles, pickups;
  let score, wave, queue, spawnT, betweenT, betweenWaves, banner, bannerT;
  let shake = 0, redFlash = 0, overT = 0, newBest = false, kills = 0, timeAlive = 0;
  let t = 0;

  const keys = {};
  const mouse = { x: W / 2, y: H / 2, down: false, active: false };
  const move = { id: null, ox: 0, oy: 0, x: 0, y: 0, vx: 0, vy: 0 };
  const aim  = { id: null, ox: 0, oy: 0, x: 0, y: 0, vx: 0, vy: 0 };
  let usingTouch = false;

  function resetGame() {
    player = { x: W / 2, y: H / 2 + 120, r: 14, hp: 100, maxhp: 100, ang: -Math.PI / 2,
               cd: 0, ammo: MAG, reloading: false, rt: 0, inv: 0, muzzle: 0 };
    bullets = []; ebullets = []; enemies = []; particles = []; pickups = [];
    score = 0; wave = 0; kills = 0; timeAlive = 0;
    queue = []; spawnT = 0; betweenWaves = true; betweenT = 0.8;
    banner = ''; bannerT = 0; shake = 0; redFlash = 0; newBest = false;
  }
  resetGame();

  // ===== 工具 =====
  const rand = (a, b) => a + Math.random() * (b - a);
  function pushOutOfWalls(o) {
    for (const w of walls) {
      const nx = Math.max(w.x, Math.min(o.x, w.x + w.w));
      const ny = Math.max(w.y, Math.min(o.y, w.y + w.h));
      let dx = o.x - nx, dy = o.y - ny;
      const d2 = dx * dx + dy * dy;
      if (d2 < o.r * o.r) {
        if (d2 > 0.0001) {
          const d = Math.sqrt(d2), k = (o.r - d) / d;
          o.x += dx * k; o.y += dy * k;
        } else {
          // 圓心在矩形內:往最近的邊推出
          const l = o.x - w.x, r = w.x + w.w - o.x, tp = o.y - w.y, b = w.y + w.h - o.y;
          const m = Math.min(l, r, tp, b);
          if (m === l) o.x = w.x - o.r;
          else if (m === r) o.x = w.x + w.w + o.r;
          else if (m === tp) o.y = w.y - o.r;
          else o.y = w.y + w.h + o.r;
        }
      }
    }
  }
  function pointInWall(x, y) {
    for (const w of walls) if (x > w.x && x < w.x + w.w && y > w.y && y < w.y + w.h) return true;
    return false;
  }
  function burst(x, y, color, n, spd = 160, life = 0.4, size = 3) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = rand(spd * 0.3, spd);
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(life * 0.5, life), max: life, color, size: rand(size * 0.5, size) });
    }
  }

  // ===== 波次與敵人 =====
  function startWave() {
    wave++;
    betweenWaves = false;
    const n = 5 + wave * 3;
    queue = [];
    for (let i = 0; i < n; i++) {
      let type = 'grunt';
      const r = Math.random();
      if (wave >= 4 && r < 0.14) type = 'tank';
      else if (wave >= 2 && r < 0.14 + 0.28) type = 'gunner';
      queue.push(type);
    }
    spawnT = 0.5;
    banner = '第 ' + wave + ' 波';
    bannerT = 2;
    sfx.wave();
  }

  function spawnEnemy(type) {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if (side === 0) { x = rand(0, W); y = -30; }
    else if (side === 1) { x = W + 30; y = rand(0, H); }
    else if (side === 2) { x = rand(0, W); y = H + 30; }
    else { x = -30; y = rand(0, H); }
    const sp = 1 + Math.min(0.5, wave * 0.03);
    const defs = {
      grunt:  { r: 12, hp: 3,  speed: 95 * sp,  color: '#e5484d', dark: '#7a1d20' },
      gunner: { r: 13, hp: 4,  speed: 80 * sp,  color: '#f5a524', dark: '#7a4d00' },
      tank:   { r: 21, hp: 14, speed: 55 * sp,  color: '#8e4ec6', dark: '#41206a' }
    };
    const d = defs[type];
    enemies.push({ type, x, y, r: d.r, hp: d.hp, maxhp: d.hp, speed: d.speed, color: d.color, dark: d.dark,
                   cd: rand(0.6, 1.6), hit: 0, ang: 0, strafe: Math.random() < 0.5 ? 1 : -1 });
  }

  function hurtPlayer(amount) {
    if (player.inv > 0 || state !== 'play') return;
    player.hp -= amount;
    player.inv = 0.3;
    shake = Math.max(shake, 8);
    redFlash = 0.35;
    sfx.hurt();
    burst(player.x, player.y, '#ff6b6b', 8, 150, 0.4);
    if (player.hp <= 0) {
      player.hp = 0;
      state = 'over';
      overT = 0;
      sfx.over();
      burst(player.x, player.y, '#4aa8ff', 40, 260, 0.9, 4);
      if (score > best) { best = score; newBest = true; saveBest(); }
    }
  }

  function killEnemy(e) {
    sfx.kill();
    kills++;
    score += e.type === 'tank' ? 50 : e.type === 'gunner' ? 20 : 10;
    burst(e.x, e.y, e.color, e.type === 'tank' ? 28 : 14, 220, 0.6, 4);
    shake = Math.max(shake, e.type === 'tank' ? 7 : 3);
    if (Math.random() < 0.1) pickups.push({ x: e.x, y: e.y, life: 12 });
  }

  // ===== 輸入 =====
  function toLogical(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }

  function startRound() {
    resetGame();
    state = 'play';
  }

  canvas.addEventListener('contextmenu', e => e.preventDefault());

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    ensureAudio();
    const p = toLogical(e);
    if (e.pointerType === 'touch') {
      usingTouch = true;
      mouse.active = false;
    }
    if (state === 'menu') { startRound(); return; }
    if (state === 'over') { if (overT > 0.6) startRound(); return; }
    if (state === 'paused') { state = 'play'; return; }

    if (e.pointerType === 'touch') {
      canvas.setPointerCapture(e.pointerId);
      if (p.x < W / 2 && move.id === null) {
        Object.assign(move, { id: e.pointerId, ox: p.x, oy: p.y, x: p.x, y: p.y, vx: 0, vy: 0 });
      } else if (p.x >= W / 2 && aim.id === null) {
        Object.assign(aim, { id: e.pointerId, ox: p.x, oy: p.y, x: p.x, y: p.y, vx: 0, vy: 0 });
      }
    } else {
      mouse.active = true;
      mouse.x = p.x; mouse.y = p.y;
      if (e.button === 0) mouse.down = true;
    }
  });

  canvas.addEventListener('pointermove', e => {
    const p = toLogical(e);
    if (e.pointerType === 'touch') {
      const s = e.pointerId === move.id ? move : e.pointerId === aim.id ? aim : null;
      if (!s) return;
      s.x = p.x; s.y = p.y;
      let dx = p.x - s.ox, dy = p.y - s.oy;
      const d = Math.hypot(dx, dy), max = 60;
      if (d > max) { s.ox = p.x - dx / d * max; s.oy = p.y - dy / d * max; dx = dx / d * max; dy = dy / d * max; }
      s.vx = dx / max; s.vy = dy / max;
    } else {
      mouse.active = true;
      mouse.x = p.x; mouse.y = p.y;
    }
  });

  function endPointer(e) {
    if (e.pointerType === 'touch') {
      if (e.pointerId === move.id) { move.id = null; move.vx = move.vy = 0; }
      if (e.pointerId === aim.id) { aim.id = null; aim.vx = aim.vy = 0; }
    } else if (e.button === 0) {
      mouse.down = false;
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    ensureAudio();
    if (e.code === 'Space' || e.code === 'Enter') {
      if (state === 'menu') startRound();
      else if (state === 'over' && overT > 0.6) startRound();
      else if (state === 'paused') state = 'play';
    }
    if (e.code === 'KeyP' || e.code === 'Escape') {
      if (state === 'play') state = 'paused';
      else if (state === 'paused') state = 'play';
    }
    if (e.code === 'KeyR' && state === 'play') startReload();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('blur', () => { if (state === 'play') state = 'paused'; mouse.down = false; });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'paused'; });

  function startReload() {
    if (player.reloading || player.ammo === MAG) return;
    player.reloading = true;
    player.rt = RELOAD_T;
    sfx.reload();
  }

  // ===== 更新 =====
  function update(dt) {
    t += dt;

    // 粒子
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.92; p.vy *= 0.92;
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 30);
    if (redFlash > 0) redFlash = Math.max(0, redFlash - dt);

    if (state === 'over') { overT += dt; return; }
    if (state !== 'play') return;

    timeAlive += dt;
    const p = player;

    // 玩家移動
    let mx = 0, my = 0;
    if (keys.KeyA || keys.ArrowLeft) mx -= 1;
    if (keys.KeyD || keys.ArrowRight) mx += 1;
    if (keys.KeyW || keys.ArrowUp) my -= 1;
    if (keys.KeyS || keys.ArrowDown) my += 1;
    if (move.id !== null) { mx += move.vx; my += move.vy; }
    const ml = Math.hypot(mx, my);
    if (ml > 1) { mx /= ml; my /= ml; }
    p.x += mx * PLAYER_SPEED * dt;
    p.y += my * PLAYER_SPEED * dt;
    p.x = Math.max(p.r, Math.min(W - p.r, p.x));
    p.y = Math.max(p.r, Math.min(H - p.r, p.y));
    pushOutOfWalls(p);

    // 瞄準
    let firing = false;
    if (aim.id !== null) {
      const m = Math.hypot(aim.vx, aim.vy);
      if (m > 0.2) { p.ang = Math.atan2(aim.vy, aim.vx); firing = m > 0.35; }
    } else if (mouse.active) {
      p.ang = Math.atan2(mouse.y - p.y, mouse.x - p.x);
      firing = mouse.down || keys.KeyJ;
    }
    if (keys.KeyJ) firing = true;

    // 射擊 / 換彈
    if (p.cd > 0) p.cd -= dt;
    if (p.muzzle > 0) p.muzzle -= dt;
    if (p.inv > 0) p.inv -= dt;
    if (p.reloading) {
      p.rt -= dt;
      if (p.rt <= 0) { p.reloading = false; p.ammo = MAG; }
    } else if (p.ammo <= 0) {
      startReload();
    } else if (firing && p.cd <= 0) {
      const a = p.ang + rand(-0.035, 0.035);
      bullets.push({ x: p.x + Math.cos(p.ang) * 26, y: p.y + Math.sin(p.ang) * 26,
                     vx: Math.cos(a) * BULLET_SPEED, vy: Math.sin(a) * BULLET_SPEED, life: 1.1 });
      p.ammo--;
      p.cd = FIRE_CD;
      p.muzzle = 0.05;
      shake = Math.max(shake, 1.5);
      sfx.shoot();
    }

    // 波次邏輯
    if (betweenWaves) {
      betweenT -= dt;
      if (betweenT <= 0) startWave();
    } else {
      if (queue.length) {
        spawnT -= dt;
        if (spawnT <= 0) {
          spawnEnemy(queue.shift());
          spawnT = Math.max(0.3, 1.1 - wave * 0.06);
        }
      } else if (enemies.length === 0) {
        betweenWaves = true;
        betweenT = 2.5;
        score += wave * 20;
        // 過關補給
        for (let tries = 0; tries < 20; tries++) {
          const px = rand(120, W - 120), py = rand(80, H - 80);
          if (!pointInWall(px, py)) { pickups.push({ x: px, y: py, life: 20 }); break; }
        }
        banner = '第 ' + wave + ' 波完成!';
        bannerT = 1.8;
      }
    }
    if (bannerT > 0) bannerT -= dt;

    // 玩家子彈
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      let dead = b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20 || pointInWall(b.x, b.y);
      if (dead && pointInWall(b.x, b.y)) burst(b.x, b.y, '#d0b080', 3, 80, 0.2, 2);
      if (!dead) {
        for (const e of enemies) {
          const dx = e.x - b.x, dy = e.y - b.y;
          if (dx * dx + dy * dy < (e.r + 3) * (e.r + 3)) {
            e.hp -= 1; e.hit = 0.08;
            e.x += b.vx * 0.004; e.y += b.vy * 0.004;
            burst(b.x, b.y, '#ffe08a', 3, 120, 0.2, 2);
            sfx.hit();
            dead = true;
            if (e.hp <= 0) e.dead = true;
            break;
          }
        }
      }
      if (dead) bullets.splice(i, 1);
    }

    // 敵人
    for (const e of enemies) {
      if (e.hit > 0) e.hit -= dt;
      if (e.cd > 0) e.cd -= dt;
      const dx = p.x - e.x, dy = p.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      const ux = dx / d, uy = dy / d;
      e.ang = Math.atan2(dy, dx);

      if (e.type === 'gunner') {
        let vx = 0, vy = 0;
        if (d > 280) { vx = ux; vy = uy; }
        else if (d < 190) { vx = -ux; vy = -uy; }
        else { vx = -uy * e.strafe * 0.7; vy = ux * e.strafe * 0.7; }
        e.x += vx * e.speed * dt; e.y += vy * e.speed * dt;
        if (e.cd <= 0 && d < 520 && e.x > 0 && e.x < W && e.y > 0 && e.y < H) {
          const a = e.ang + rand(-0.06, 0.06);
          ebullets.push({ x: e.x + Math.cos(a) * 16, y: e.y + Math.sin(a) * 16,
                          vx: Math.cos(a) * 290, vy: Math.sin(a) * 290, life: 3 });
          e.cd = rand(1.2, 2);
          sfx.eshoot();
        }
      } else {
        e.x += ux * e.speed * dt; e.y += uy * e.speed * dt;
        if (d < e.r + p.r && e.cd <= 0) {
          hurtPlayer(e.type === 'tank' ? 20 : 10);
          e.cd = 0.7;
        }
      }
    }
    // 敵人互相推開 & 撞牆
    for (let i = 0; i < enemies.length; i++) {
      const a = enemies[i];
      for (let j = i + 1; j < enemies.length; j++) {
        const b = enemies[j];
        const dx = b.x - a.x, dy = b.y - a.y, min = a.r + b.r;
        const d2 = dx * dx + dy * dy;
        if (d2 < min * min && d2 > 0.01) {
          const d = Math.sqrt(d2), k = (min - d) / d * 0.5;
          a.x -= dx * k; a.y -= dy * k; b.x += dx * k; b.y += dy * k;
        }
      }
      if (a.x > 0 && a.x < W && a.y > 0 && a.y < H) pushOutOfWalls(a);
    }
    for (let i = enemies.length - 1; i >= 0; i--) {
      if (enemies[i].dead) { killEnemy(enemies[i]); enemies.splice(i, 1); }
    }

    // 敵方子彈
    for (let i = ebullets.length - 1; i >= 0; i--) {
      const b = ebullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      let dead = b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20 || pointInWall(b.x, b.y);
      if (!dead) {
        const dx = p.x - b.x, dy = p.y - b.y;
        if (dx * dx + dy * dy < (p.r + 4) * (p.r + 4)) { hurtPlayer(8); dead = true; }
      }
      if (dead) ebullets.splice(i, 1);
    }

    // 補給品
    for (let i = pickups.length - 1; i >= 0; i--) {
      const k = pickups[i];
      k.life -= dt;
      if (k.life <= 0) { pickups.splice(i, 1); continue; }
      const dx = p.x - k.x, dy = p.y - k.y;
      if (dx * dx + dy * dy < (p.r + 12) * (p.r + 12)) {
        p.hp = Math.min(p.maxhp, p.hp + 25);
        sfx.pickup();
        burst(k.x, k.y, '#6be675', 12, 140, 0.5);
        pickups.splice(i, 1);
      }
    }
  }

  // ===== 繪製 =====
  function text(str, x, y, size, color = '#fff', align = 'center', stroke = true) {
    ctx.font = `bold ${size}px ${FONT}`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    if (stroke) {
      ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(3, size / 6);
      ctx.strokeStyle = 'rgba(0,0,0,0.85)';
      ctx.strokeText(str, x, y);
    }
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function drawFloor() {
    ctx.fillStyle = '#1d2229';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = 0; y <= H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
    // 邊框
    ctx.strokeStyle = '#3a4350';
    ctx.lineWidth = 6;
    ctx.strokeRect(3, 3, W - 6, H - 6);
  }

  function drawWalls() {
    for (const w of walls) {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(w.x + 5, w.y + 6, w.w, w.h);
      ctx.fillStyle = '#8a6a43';
      ctx.fillRect(w.x, w.y, w.w, w.h);
      ctx.strokeStyle = '#4e3a22';
      ctx.lineWidth = 3;
      ctx.strokeRect(w.x + 1.5, w.y + 1.5, w.w - 3, w.h - 3);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(w.x + 4, w.y + 4); ctx.lineTo(w.x + w.w - 4, w.y + w.h - 4);
      ctx.moveTo(w.x + w.w - 4, w.y + 4); ctx.lineTo(w.x + 4, w.y + w.h - 4);
      ctx.stroke();
    }
  }

  function drawShadow(x, y, r) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(x + 3, y + 5, r, r * 0.8, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPlayer() {
    const p = player;
    if (state === 'over') return;
    drawShadow(p.x, p.y, p.r);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.ang);
    // 槍
    ctx.fillStyle = '#2b2f36';
    ctx.fillRect(6, -4, 24, 8);
    ctx.fillStyle = '#555c68';
    ctx.fillRect(6, -4, 16, 3);
    // 身體
    const blink = p.inv > 0 && Math.floor(t * 30) % 2 === 0;
    ctx.fillStyle = blink ? '#ffffff' : '#3b8fe0';
    ctx.strokeStyle = '#173d66';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // 頭盔
    ctx.fillStyle = '#2a5f99';
    ctx.beginPath();
    ctx.arc(-1, 0, 8, 0, Math.PI * 2);
    ctx.fill();
    // 槍口火光
    if (p.muzzle > 0) {
      ctx.fillStyle = '#ffd34d';
      ctx.beginPath();
      ctx.moveTo(30, 0); ctx.lineTo(42, -6); ctx.lineTo(38, 0); ctx.lineTo(42, 6);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawEnemy(e) {
    drawShadow(e.x, e.y, e.r);
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.ang);
    if (e.type === 'gunner') {
      ctx.fillStyle = '#2b2f36';
      ctx.fillRect(6, -3.5, 20, 7);
    }
    ctx.fillStyle = e.hit > 0 ? '#ffffff' : e.color;
    ctx.strokeStyle = e.dark;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, e.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    if (e.type === 'tank') {
      ctx.strokeStyle = e.dark;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, e.r * 0.6, 0, Math.PI * 2);
      ctx.stroke();
    }
    // 眼睛
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(e.r * 0.45, -e.r * 0.3, e.r * 0.22, 0, Math.PI * 2);
    ctx.arc(e.r * 0.45, e.r * 0.3, e.r * 0.22, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(e.r * 0.52, -e.r * 0.3, e.r * 0.1, 0, Math.PI * 2);
    ctx.arc(e.r * 0.52, e.r * 0.3, e.r * 0.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (e.hp < e.maxhp) {
      const w = e.r * 2;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(e.x - w / 2, e.y - e.r - 10, w, 4);
      ctx.fillStyle = '#ff6b6b';
      ctx.fillRect(e.x - w / 2, e.y - e.r - 10, w * Math.max(0, e.hp / e.maxhp), 4);
    }
  }

  function drawPickup(k) {
    if (k.life < 3 && Math.floor(k.life * 6) % 2 === 0) return;
    const bob = Math.sin(t * 5 + k.x) * 2;
    ctx.fillStyle = '#f2f2f2';
    ctx.strokeStyle = '#1b7a2a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(k.x, k.y + bob, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#2fbf4a';
    ctx.fillRect(k.x - 7, k.y + bob - 2.5, 14, 5);
    ctx.fillRect(k.x - 2.5, k.y + bob - 7, 5, 14);
  }

  function drawHUD() {
    const p = player;
    // 血條
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(16, 16, 220, 22);
    const ratio = p.hp / p.maxhp;
    ctx.fillStyle = ratio > 0.5 ? '#3ccf5a' : ratio > 0.25 ? '#f5a524' : '#e5484d';
    ctx.fillRect(18, 18, 216 * ratio, 18);
    text('生命 ' + Math.ceil(p.hp), 26, 27, 14, '#fff', 'left');

    // 彈藥
    if (p.reloading) {
      text('換彈中…', 16, 56, 18, '#ffd34d', 'left');
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(16, 70, 120, 6);
      ctx.fillStyle = '#ffd34d';
      ctx.fillRect(16, 70, 120 * (1 - p.rt / RELOAD_T), 6);
    } else {
      text('彈藥 ' + p.ammo + ' / ' + MAG, 16, 56, 18, '#fff', 'left');
      for (let i = 0; i < MAG; i++) {
        ctx.fillStyle = i < p.ammo ? '#ffd34d' : 'rgba(255,255,255,0.15)';
        ctx.fillRect(16 + i * 8, 70, 5, 10);
      }
    }

    // 分數與波數
    text('分數 ' + score, W - 16, 27, 22, '#fff', 'right');
    text('第 ' + wave + ' 波  ·  最高 ' + best, W - 16, 54, 15, '#c9d1d9', 'right');
    const left = queue.length + enemies.length;
    if (!betweenWaves) text('剩餘敵人 ' + left, W - 16, 76, 14, '#c9d1d9', 'right');

    // 波次橫幅
    if (bannerT > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, bannerT * 2);
      text(banner, W / 2, 120, 44, '#ffd34d');
      ctx.restore();
    }
  }

  function drawCrosshair() {
    if (!mouse.active || usingTouch || state !== 'play') return;
    const { x, y } = mouse;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, 10, 0, Math.PI * 2);
    ctx.moveTo(x - 16, y); ctx.lineTo(x - 5, y);
    ctx.moveTo(x + 5, y);  ctx.lineTo(x + 16, y);
    ctx.moveTo(x, y - 16); ctx.lineTo(x, y - 5);
    ctx.moveTo(x, y + 5);  ctx.lineTo(x, y + 16);
    ctx.stroke();
  }

  function drawSticks() {
    for (const s of [move, aim]) {
      if (s.id === null) continue;
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(s.ox, s.oy, 60, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath();
      ctx.arc(s.ox + s.vx * 60, s.oy + s.vy * 60, 24, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function overlay(alpha) {
    ctx.fillStyle = `rgba(0,0,0,${alpha})`;
    ctx.fillRect(0, 0, W, H);
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);

    drawFloor();
    for (const k of pickups) drawPickup(k);
    drawWalls();
    for (const e of enemies) drawEnemy(e);
    drawPlayer();

    // 子彈
    ctx.fillStyle = '#ffe08a';
    for (const b of bullets) {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx));
      ctx.fillRect(-9, -1.8, 12, 3.6);
      ctx.restore();
    }
    ctx.fillStyle = '#ff6b6b';
    for (const b of ebullets) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 4.5, 0, Math.PI * 2);
      ctx.fill();
    }
    // 粒子
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (redFlash > 0) {
      ctx.fillStyle = `rgba(200,0,0,${redFlash * 0.6})`;
      ctx.fillRect(0, 0, W, H);
    }

    if (state === 'play' || state === 'paused' || state === 'over') drawHUD();
    drawSticks();
    drawCrosshair();

    if (state === 'menu') {
      overlay(0.6);
      text('槍戰求生', W / 2, 150, 68, '#ffd34d');
      text('擊退一波又一波的敵人,活得越久分數越高', W / 2, 215, 20, '#c9d1d9');
      const lines = [
        'W A S D / 方向鍵 ─ 移動',
        '滑鼠 ─ 瞄準,按住左鍵射擊(或按 J)',
        'R ─ 換彈    P / Esc ─ 暫停',
        '手機:左半邊滑動移動,右半邊滑動瞄準並自動射擊'
      ];
      lines.forEach((l, i) => text(l, W / 2, 275 + i * 30, 17, '#fff'));
      text('紅色:小兵    橘色:槍手(會開槍)    紫色:重甲兵(血很厚)', W / 2, 410, 15, '#c9d1d9');
      const a = 0.6 + Math.sin(t * 4) * 0.4;
      ctx.save();
      ctx.globalAlpha = a;
      text('點擊畫面或按空白鍵開始', W / 2, 480, 26, '#fff');
      ctx.restore();
      if (best > 0) text('最高分:' + best, W / 2, 530, 18, '#ffd34d');
    }

    if (state === 'paused') {
      overlay(0.55);
      text('已暫停', W / 2, H / 2 - 20, 54, '#fff');
      text('點擊畫面、按 P 或空白鍵繼續', W / 2, H / 2 + 36, 20, '#c9d1d9');
    }

    if (state === 'over') {
      overlay(Math.min(0.65, overT * 0.8));
      if (overT > 0.3) {
        text('你倒下了', W / 2, 150, 60, '#ff6b6b');
        text('分數  ' + score, W / 2, 235, 38);
        text('撐到第 ' + wave + ' 波  ·  擊敗 ' + kills + ' 名敵人  ·  存活 ' + Math.floor(timeAlive) + ' 秒', W / 2, 290, 18, '#c9d1d9');
        if (newBest) text('★ 新紀錄! ★', W / 2, 335, 26, '#ffd34d');
        else text('最高分  ' + best, W / 2, 335, 22, '#ffd34d');
        if (overT > 0.6) {
          ctx.save();
          ctx.globalAlpha = 0.6 + Math.sin(t * 4) * 0.4;
          text('點擊畫面或按空白鍵再戰一次', W / 2, 430, 24);
          ctx.restore();
        }
      }
    }
  }

  // ===== 主迴圈 =====
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    // 兩次子步,碰撞更穩定
    update(dt / 2);
    update(dt / 2);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
