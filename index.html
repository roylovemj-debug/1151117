<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小藍鳥大冒險</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1b2430;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    box-shadow: 0 8px 30px rgba(0, 0, 0, .5);
    border-radius: 6px;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
(() => {
  'use strict';

  // ===== 基本設定 =====
  const W = 400, H = 600;
  const GROUND_H = 80;
  const GROUND_Y = H - GROUND_H;

  const GRAVITY = 1500;      // px/s^2
  const FLAP_V = -440;       // 拍翅膀的向上速度
  const MAX_FALL = 700;
  const PIPE_SPEED = 165;    // px/s
  const PIPE_W = 64;
  const PIPE_GAP = 150;
  const PIPE_SPACING = 220;
  const BIRD_X = 100;
  const BIRD_R = 14;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // ===== 畫布縮放(支援高解析度螢幕與手機)=====
  function resize() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    const cssW = Math.floor(W * scale);
    const cssH = Math.floor(H * scale);
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = Math.floor(cssW * dpr);
    canvas.height = Math.floor(cssH * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ===== 最高分 =====
  let best = 0;
  try { best = parseInt(localStorage.getItem('blueBirdBest') || '0', 10) || 0; } catch (e) {}
  function saveBest() {
    try { localStorage.setItem('blueBirdBest', String(best)); } catch (e) {}
  }

  // ===== 音效(WebAudio 合成,無需檔案)=====
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, dur, type = 'square', vol = 0.06, slideTo = null) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur);
  }
  const sfx = {
    flap:  () => beep(420, 0.12, 'square', 0.05, 640),
    score: () => { beep(880, 0.08, 'triangle', 0.08); setTimeout(() => beep(1320, 0.12, 'triangle', 0.08), 70); },
    hit:   () => beep(180, 0.25, 'sawtooth', 0.09, 60),
    fall:  () => beep(300, 0.4, 'triangle', 0.06, 80)
  };

  // ===== 遊戲狀態 =====
  const READY = 0, PLAYING = 1, DEAD = 2;
  let state = READY;
  let bird, pipes, score, groundX, clouds, flash, deadTime, newBest, idleT;

  function initClouds() {
    clouds = [];
    for (let i = 0; i < 5; i++) {
      clouds.push({
        x: Math.random() * W,
        y: 40 + Math.random() * 220,
        s: 0.6 + Math.random() * 0.9
      });
    }
  }
  initClouds();

  function reset() {
    bird = { x: BIRD_X, y: H / 2 - 20, vy: 0, rot: 0, wing: 0 };
    pipes = [];
    score = 0;
    groundX = 0;
    flash = 0;
    deadTime = 0;
    newBest = false;
    idleT = 0;
    state = READY;
  }
  reset();

  function spawnPipe(x) {
    const margin = 90;
    const minY = margin + PIPE_GAP / 2;
    const maxY = GROUND_Y - margin - PIPE_GAP / 2;
    pipes.push({ x, gapY: minY + Math.random() * (maxY - minY), passed: false });
  }

  function flap() {
    bird.vy = FLAP_V;
    sfx.flap();
  }

  function die() {
    if (state === DEAD) return;
    state = DEAD;
    flash = 1;
    deadTime = 0;
    sfx.hit();
    setTimeout(sfx.fall, 120);
    if (score > best) {
      best = score;
      newBest = true;
      saveBest();
    }
  }

  // ===== 輸入 =====
  function onAction() {
    ensureAudio();
    if (state === READY) {
      state = PLAYING;
      spawnPipe(W + 60);
      flap();
    } else if (state === PLAYING) {
      flap();
    } else if (state === DEAD && deadTime > 0.5) {
      reset();
    }
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (!e.repeat) onAction();
    }
  });
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    onAction();
  });

  // ===== 碰撞偵測(圓形 vs 矩形)=====
  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  // ===== 更新邏輯(固定時間步長)=====
  function update(dt) {
    // 雲朵慢慢飄
    for (const c of clouds) {
      c.x -= 12 * c.s * dt;
      if (c.x < -80) { c.x = W + 40; c.y = 40 + Math.random() * 220; }
    }

    if (flash > 0) flash = Math.max(0, flash - dt * 3);

    if (state === READY) {
      idleT += dt;
      bird.y = H / 2 - 20 + Math.sin(idleT * 4) * 8;
      bird.wing += dt * 14;
      groundX = (groundX + PIPE_SPEED * dt) % 24;
      return;
    }

    if (state === PLAYING) {
      groundX = (groundX + PIPE_SPEED * dt) % 24;
      bird.wing += dt * 18;

      // 水管
      for (const p of pipes) p.x -= PIPE_SPEED * dt;
      if (pipes.length && pipes[0].x + PIPE_W < -10) pipes.shift();
      const last = pipes[pipes.length - 1];
      if (!last || last.x < W - PIPE_SPACING) spawnPipe(W + 10);

      // 小鳥
      bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
      bird.y += bird.vy * dt;
      if (bird.y < BIRD_R) { bird.y = BIRD_R; bird.vy = Math.max(bird.vy, 0); }

      // 計分
      for (const p of pipes) {
        if (!p.passed && p.x + PIPE_W < bird.x - BIRD_R) {
          p.passed = true;
          score++;
          sfx.score();
        }
      }

      // 碰撞
      if (bird.y + BIRD_R >= GROUND_Y) {
        bird.y = GROUND_Y - BIRD_R;
        die();
      } else {
        for (const p of pipes) {
          const top = p.gapY - PIPE_GAP / 2;
          const bot = p.gapY + PIPE_GAP / 2;
          if (circleRect(bird.x, bird.y, BIRD_R - 1, p.x, 0, PIPE_W, top) ||
              circleRect(bird.x, bird.y, BIRD_R - 1, p.x, bot, PIPE_W, GROUND_Y - bot)) {
            die();
            break;
          }
        }
      }
    } else if (state === DEAD) {
      deadTime += dt;
      if (bird.y + BIRD_R < GROUND_Y) {
        bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
        bird.y += bird.vy * dt;
        if (bird.y + BIRD_R > GROUND_Y) bird.y = GROUND_Y - BIRD_R;
      }
    }

    // 旋轉角度
    const target = Math.max(-0.45, Math.min(1.4, bird.vy / 500));
    bird.rot += (target - bird.rot) * Math.min(1, dt * 12);
  }

  // ===== 繪製 =====
  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    g.addColorStop(0, '#4ec0ee');
    g.addColorStop(1, '#bfeaf7');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 雲
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (const c of clouds) {
      const r = 18 * c.s;
      ctx.beginPath();
      ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
      ctx.arc(c.x + r * 1.1, c.y + r * 0.2, r * 0.8, 0, Math.PI * 2);
      ctx.arc(c.x - r * 1.1, c.y + r * 0.25, r * 0.7, 0, Math.PI * 2);
      ctx.arc(c.x + r * 0.2, c.y - r * 0.5, r * 0.75, 0, Math.PI * 2);
      ctx.fill();
    }

    // 遠景山丘
    ctx.fillStyle = '#9fd8a5';
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    for (let x = 0; x <= W; x += 10) {
      ctx.lineTo(x, GROUND_Y - 30 - Math.sin(x * 0.02) * 14 - Math.sin(x * 0.047 + 1) * 8);
    }
    ctx.lineTo(W, GROUND_Y);
    ctx.closePath();
    ctx.fill();
  }

  function drawPipe(p) {
    const top = p.gapY - PIPE_GAP / 2;
    const bot = p.gapY + PIPE_GAP / 2;
    const capH = 24, capExtra = 4;

    function body(x, y, w, h) {
      const g = ctx.createLinearGradient(x, 0, x + w, 0);
      g.addColorStop(0, '#5aa02c');
      g.addColorStop(0.35, '#8fd14f');
      g.addColorStop(1, '#4a8a22');
      ctx.fillStyle = g;
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = '#2f5d14';
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
    }

    // 上水管
    body(p.x + 3, -2, PIPE_W - 6, top - capH + 2);
    body(p.x - capExtra, top - capH, PIPE_W + capExtra * 2, capH);
    // 下水管
    body(p.x + 3, bot + capH, PIPE_W - 6, GROUND_Y - bot - capH);
    body(p.x - capExtra, bot, PIPE_W + capExtra * 2, capH);
  }

  function drawGround() {
    ctx.fillStyle = '#ded895';
    ctx.fillRect(0, GROUND_Y, W, GROUND_H);
    // 草地條紋
    ctx.fillStyle = '#73bf2e';
    ctx.fillRect(0, GROUND_Y, W, 14);
    ctx.fillStyle = '#8ed63f';
    for (let x = -24 + (-groundX); x < W + 24; x += 24) {
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y);
      ctx.lineTo(x + 12, GROUND_Y);
      ctx.lineTo(x + 24, GROUND_Y + 14);
      ctx.lineTo(x + 12, GROUND_Y + 14);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = '#2f5d14';
    ctx.fillRect(0, GROUND_Y, W, 2);
    ctx.fillStyle = '#c9c07a';
    ctx.fillRect(0, GROUND_Y + 14, W, 3);
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);

    // 身體
    const g = ctx.createRadialGradient(-4, -5, 2, 0, 0, BIRD_R + 4);
    g.addColorStop(0, '#7fd4ff');
    g.addColorStop(1, '#2a8fd6');
    ctx.fillStyle = g;
    ctx.strokeStyle = '#17517a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, BIRD_R + 3, BIRD_R, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 肚子
    ctx.fillStyle = '#e9f7ff';
    ctx.beginPath();
    ctx.ellipse(1, 6, 10, 6, 0, 0, Math.PI);
    ctx.fill();

    // 頭上小羽毛
    ctx.strokeStyle = '#17517a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-2, -BIRD_R + 1);
    ctx.quadraticCurveTo(-6, -BIRD_R - 8, -10, -BIRD_R - 5);
    ctx.moveTo(1, -BIRD_R + 1);
    ctx.quadraticCurveTo(0, -BIRD_R - 9, -4, -BIRD_R - 9);
    ctx.stroke();

    // 翅膀(上下拍動)
    const flapAngle = state === DEAD ? 0.6 : Math.sin(bird.wing) * 0.8;
    ctx.save();
    ctx.translate(-5, 2);
    ctx.rotate(flapAngle);
    ctx.fillStyle = '#1f6fb0';
    ctx.strokeStyle = '#17517a';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(0, 0, 9, 5, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // 眼睛
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(8, -5, 5.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#111';
    if (state === DEAD) {
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(5.5, -7.5); ctx.lineTo(10.5, -2.5);
      ctx.moveTo(10.5, -7.5); ctx.lineTo(5.5, -2.5);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(9.5, -5, 2.4, 0, Math.PI * 2);
      ctx.fill();
    }

    // 嘴巴
    ctx.fillStyle = '#ff9f2e';
    ctx.strokeStyle = '#8a4a00';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.lineTo(24, 3);
    ctx.lineTo(14, 7);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.restore();
  }

  function outlinedText(text, x, y, size, align = 'center') {
    ctx.font = `bold ${size}px "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(4, size / 6);
    ctx.strokeStyle = '#1b2430';
    ctx.strokeText(text, x, y);
    ctx.fillStyle = '#fff';
    ctx.fillText(text, x, y);
  }

  function drawHUD() {
    if (state === PLAYING || state === DEAD) {
      outlinedText(String(score), W / 2, 70, 56);
    }

    if (state === READY) {
      outlinedText('小藍鳥大冒險', W / 2, 150, 38);
      outlinedText('點擊畫面或按空白鍵開始', W / 2, 330, 20);
      outlinedText('最高分:' + best, W / 2, 365, 18);
      // 提示手指動畫
      const s = 1 + Math.sin(idleT * 6) * 0.08;
      ctx.save();
      ctx.translate(W / 2, 270);
      ctx.scale(s, s);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.strokeStyle = '#1b2430';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#1b2430';
      ctx.beginPath();
      ctx.moveTo(0, -10); ctx.lineTo(9, 2); ctx.lineTo(-9, 2);
      ctx.closePath();
      ctx.fill();
      ctx.fillRect(-3, 2, 6, 9);
      ctx.restore();
    }

    if (state === DEAD && deadTime > 0.35) {
      const a = Math.min(1, (deadTime - 0.35) * 4);
      ctx.save();
      ctx.globalAlpha = a;
      const py = 170 + (1 - a) * 20;

      ctx.fillStyle = '#ded895';
      ctx.strokeStyle = '#6b5a2a';
      ctx.lineWidth = 4;
      roundRect(W / 2 - 130, py, 260, 170, 14);
      ctx.fill();
      ctx.stroke();

      outlinedText('遊戲結束', W / 2, py - 26, 36);

      ctx.fillStyle = '#6b5a2a';
      ctx.font = 'bold 18px "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('分數', W / 2 - 100, py + 38);
      ctx.fillText('最高', W / 2 - 100, py + 88);
      ctx.textAlign = 'right';
      ctx.font = 'bold 34px system-ui, sans-serif';
      ctx.fillText(String(score), W / 2 + 100, py + 40);
      ctx.fillText(String(best), W / 2 + 100, py + 90);

      if (newBest) {
        ctx.fillStyle = '#e8441c';
        ctx.font = 'bold 16px "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('★ 新紀錄! ★', W / 2, py + 130);
      } else {
        // 獎牌
        const medal = score >= 40 ? ['金牌', '#ffd84a'] :
                      score >= 20 ? ['銀牌', '#d5dde5'] :
                      score >= 10 ? ['銅牌', '#d78c4f'] : null;
        if (medal) {
          ctx.fillStyle = medal[1];
          ctx.strokeStyle = '#6b5a2a';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(W / 2, py + 135, 14, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#6b5a2a';
          ctx.font = 'bold 12px "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(medal[0], W / 2, py + 136);
        }
      }
      ctx.restore();

      if (deadTime > 0.5) {
        outlinedText('點擊畫面重新開始', W / 2, 400, 20);
      }
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function render() {
    drawBackground();
    for (const p of pipes) drawPipe(p);
    drawGround();
    drawBird();
    drawHUD();

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flash * 0.8})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ===== 主迴圈(固定步長,在不同螢幕更新率下速度一致)=====
  const STEP = 1 / 120;
  let acc = 0, lastT = performance.now();

  function frame(now) {
    let dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.1) dt = 0.1; // 切換分頁回來時避免瞬間跳動
    acc += dt;
    while (acc >= STEP) {
      update(STEP);
      acc -= STEP;
    }
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
